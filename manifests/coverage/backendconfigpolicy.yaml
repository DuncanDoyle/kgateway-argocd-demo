# Dedicated target. A BackendConfigPolicy failure surfaces on the targeted
# Backend's own status, so coverage policies must NEVER target demo resources
# (Backend/httpbin-static is the source of a tracked fixture).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: coverage-backend
  namespace: httpbin
spec:
  static:
    hosts:
    - host: httpbin.httpbin.svc.cluster.local
      port: 8000
---
# Healthy: attaches to the coverage app's own Backend.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: bcp-healthy
  namespace: httpbin
spec:
  targetRefs:
  - group: gateway.kgateway.dev
    kind: Backend
    name: coverage-backend
---
# Degraded candidate: TLS referencing a Secret that does not exist. Schema-valid,
# so it passes admission; expected to fail at translation.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: bcp-degraded
  namespace: httpbin
spec:
  targetRefs:
  - group: gateway.kgateway.dev
    kind: Backend
    name: coverage-backend
  tls:
    secretRef:
      name: no-such-tls-secret
